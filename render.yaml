services:
  - type: web
    name: snmflix-media-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://snmflix.vercel.app
      - key: MAX_CONCURRENT_EXTRACTIONS
        value: 5
      - key: EXTRACTION_TIMEOUT_SECONDS
        value: 20
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: MAX_FORMATS_RETURNED
        value: 100
      - key: MAX_REQUEST_BODY_SIZE
        value: 65536
