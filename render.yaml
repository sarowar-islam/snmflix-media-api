services:
  - type: web
    name: snmflix-media-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://snmflix.vercel.app
      - key: MAX_CONCURRENT_EXTRACTIONS
        value: 5
      - key: EXTRACTION_TIMEOUT_SECONDS
        value: 20
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: MAX_FORMATS_RETURNED
        value: 100
      - key: MAX_REQUEST_BODY_SIZE
        value: 65536
